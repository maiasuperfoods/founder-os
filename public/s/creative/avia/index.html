<style>
/* Layout: sticky filter bar over a strategist-tabbed workbench; summary tiles first, dense sortable ad table below. */
:root{
  --bg:#f6f6f3; --surface:#fcfcfb; --surface-2:#f0efea; --line:#e1e0d9; --line-strong:#c9c8c0;
  --ink:#0f0f0e; --ink-2:#52514e; --ink-3:#8b8a84;
  --accent:#2a78d6; --accent-soft:#e3eefb; --accent-ink:#1b5aa8;
  --good:#008300; --good-soft:#e2f3e2; --warn:#c98500; --warn-soft:#fbf0d6; --crit:#d13c3b; --crit-soft:#fbe3e3; --mute-soft:#ecebe6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --font:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --radius:8px; --shadow:0 1px 2px rgba(20,20,10,.06),0 1px 1px rgba(20,20,10,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413; --surface:#1d1d1b; --surface-2:#262624; --line:#33332f; --line-strong:#4a4944;
  --ink:#f4f3ee; --ink-2:#c3c2b7; --ink-3:#8c8b83;
  --accent:#3987e5; --accent-soft:#1c2c42; --accent-ink:#8fbcf3;
  --good:#3fb53f; --good-soft:#1b2e1b; --warn:#e0a21d; --warn-soft:#352b12; --crit:#ef6c6b; --crit-soft:#3a1f1f; --mute-soft:#2b2b28;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141413; --surface:#1d1d1b; --surface-2:#262624; --line:#33332f; --line-strong:#4a4944;
  --ink:#f4f3ee; --ink-2:#c3c2b7; --ink-3:#8c8b83;
  --accent:#3987e5; --accent-soft:#1c2c42; --accent-ink:#8fbcf3;
  --good:#3fb53f; --good-soft:#1b2e1b; --warn:#e0a21d; --warn-soft:#352b12; --crit:#ef6c6b; --crit-soft:#3a1f1f; --mute-soft:#2b2b28;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px;line-height:1.45;margin:0}
.wrap{max-width:1500px;margin:0 auto;padding-block:20px 48px;padding-inline:16px;min-width:0}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}
.sub{color:var(--ink-2);margin:4px 0 0;font-size:13px}
.sub b{color:var(--ink);font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px}
.eyebrow{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:16px}
.rule{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-2)}
.tbtn{appearance:none;font:inherit;font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius);padding:4px 10px;cursor:pointer}
.rule code{font-family:var(--mono);background:var(--surface-2);border:1px solid var(--line);padding:1px 6px;border-radius:4px;color:var(--ink)}

/* tabs */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{appearance:none;border:0;background:none;font:inherit;font-weight:600;color:var(--ink-2);padding:10px 12px 9px;border-bottom:2px solid transparent;cursor:pointer;display:flex;gap:8px;align-items:center;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .cnt{font-family:var(--mono);font-size:11px;color:var(--ink-3);background:var(--surface-2);padding:1px 6px;border-radius:10px}
.tab .sw{width:9px;height:9px;border-radius:2px;display:inline-block}
.tab:focus-visible,.chip:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* filters */
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line);margin-bottom:16px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.seg button{appearance:none;border:0;background:none;font:inherit;font-weight:500;color:var(--ink-2);padding:6px 11px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
select,input[type=search],input[type=number],input[type=date]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius);padding:6px 9px;height:32px}
input[type=search]{min-width:200px}
input[type=number]{width:84px;font-family:var(--mono)}
label.f{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:12px}
.legend{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.tile .v{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:4px;line-height:1.1}
.tile .v small{font-size:13px;color:var(--ink-3);font-weight:500}
.tile .d{color:var(--ink-3);font-size:11.5px;margin-top:4px}
.tile.hit{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-soft),var(--surface) 70%)}
.meter{height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* panels */
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-bottom:18px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.panel h3{font-size:13px;font-weight:600;margin:0;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel h3 span{color:var(--ink-3);font-weight:500;font-size:12px}
.panel .body{padding:10px 14px}
svg text{font-family:var(--font);fill:var(--ink-2);font-size:11px}
svg .tick{stroke:var(--line);stroke-width:1}
svg .axis{stroke:var(--line-strong)}
.tt{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:12px;z-index:50;display:none;max-width:280px;line-height:1.35}
.tt b{font-family:var(--mono)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:1180px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;background:var(--surface-2);position:sticky;top:0;cursor:pointer;user-select:none}
th.l,td.l{text-align:left}
th.grp{text-align:center;cursor:default;border-left:1px solid var(--line);border-bottom:0;background:var(--surface-2);color:var(--ink-2)}
th.sub{border-left:1px solid var(--line);color:var(--ink-3)}
th[aria-sort="descending"]::after{content:" ▾";color:var(--ink)}
th[aria-sort="none"]::after{content:" ↕";opacity:0;transition:opacity .12s}
th[aria-sort="none"]:hover::after,th[aria-sort="none"]:focus-visible::after{opacity:.45}
th[aria-sort]{cursor:pointer}
th[aria-sort]:hover{color:var(--ink)}
th[aria-sort="ascending"]::after{content:" ▴";color:var(--ink)}
td.gl{border-left:1px solid var(--line)}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.adcell{display:flex;gap:10px;align-items:center;min-width:360px;max-width:460px;white-space:normal}
.thumbwrap{position:relative;width:44px;height:44px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;text-decoration:none}
.thumb{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.thumbico{position:relative;font-size:13px;color:var(--ink-2);background:var(--surface);border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;opacity:.9}
.adname{font-weight:600;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{color:var(--ink-3);font-size:11.5px;margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.meta a{color:var(--accent-ink);text-decoration:none;font-weight:500}
.meta a:hover,.meta .lnk:hover{text-decoration:underline}
.lnk{all:unset;cursor:pointer;color:var(--accent-ink);font-weight:500;font-size:inherit}.lnk:focus-visible,button.thumbwrap:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
button.thumbwrap{cursor:pointer;padding:0;font:inherit;color:inherit}
.tag{background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:10.5px;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;border:1px solid transparent}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.winner{background:var(--good-soft);color:var(--good)}
.chip.potential{background:var(--warn-soft);color:var(--warn)}
.chip.loser{background:var(--crit-soft);color:var(--crit)}
.chip.untested{background:var(--mute-soft);color:var(--ink-3)}
.spendbar{height:4px;background:var(--surface-2);border-radius:2px;margin-top:4px;overflow:hidden}
.spendbar i{display:block;height:100%;background:var(--accent);opacity:.65}
.pill{display:inline-block;padding:1px 7px;border-radius:4px;font-family:var(--mono);font-size:12px;font-weight:600}
.pill.g{background:var(--good-soft);color:var(--good)}.pill.w{background:var(--warn-soft);color:var(--warn)}.pill.r{background:var(--crit-soft);color:var(--crit)}.pill.n{color:var(--ink-3)}
.st{font-size:10.5px;color:var(--ink-3)}
.st.ACTIVE{color:var(--good);font-weight:600}
.empty{padding:40px;text-align:center;color:var(--ink-3)}
.foot{margin-top:18px;color:var(--ink-3);font-size:12px;line-height:1.6;max-width:70ch}
.lb td.l{font-weight:600}
.lb td,.lb th{padding:9px 7px}
.lb .rk{font-family:var(--mono);font-weight:600;color:var(--ink-2);width:34px;text-align:left}
.lb tr.top1 .rk{color:var(--accent-ink)}
.lb .sec td{text-align:left;background:var(--surface-2);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:7px 10px;cursor:default}
.lb tr.unranked td{color:var(--ink-2)}
.lb tr.unranked td.l{font-weight:500}
.lb .range{display:block;font-size:10.5px;color:var(--ink-3);font-family:var(--mono);margin-top:1px}
.lb .need{font-size:11px;color:var(--ink-3);font-weight:500;margin-left:6px}
.lb .delta{font-family:var(--mono);font-size:11.5px}
.lb .delta.up{color:var(--good)}.lb .delta.dn{color:var(--crit)}.lb .delta.eq{color:var(--ink-3)}
.conf{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:9px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface)}
.conf.hi{background:var(--good-soft);color:var(--good);border-color:transparent}
.conf.md{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.scorebar{position:relative;display:inline-block;width:70px;height:8px;background:var(--surface-2);border-radius:4px;vertical-align:middle;margin-right:7px}
.scorebar i{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--accent) 28%,transparent);border-radius:4px}
.scorebar b{position:absolute;top:-2px;width:3px;height:12px;background:var(--accent);border-radius:2px;transform:translateX(-1px)}
.scorebar u{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--ink-3);text-decoration:none}
.wk{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.wk.hook{background:var(--crit-soft);color:var(--crit)}
.wk.ret{background:var(--warn-soft);color:var(--warn)}
.wk.cta{background:var(--accent-soft);color:var(--accent-ink)}
.wk.post{background:var(--mute-soft);color:var(--ink-2);border-color:var(--line)}
.wk.strong{background:var(--good-soft);color:var(--good)}
.rate{font-family:var(--mono);font-size:12px;font-weight:600;padding:1px 6px;border-radius:4px}
.rate.g{background:var(--good-soft);color:var(--good)}.rate.w{background:var(--warn-soft);color:var(--warn)}.rate.r{background:var(--crit-soft);color:var(--crit)}.rate.n{color:var(--ink-3);font-weight:500}
.sect-h{display:flex;align-items:baseline;gap:10px;margin:2px 0 8px}
.sect-h b{font-size:13px}.sect-h span{color:var(--ink-3);font-size:12px}
.diag{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;padding:12px 14px}
.diag button{appearance:none;font:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;cursor:pointer;display:grid;gap:4px}
.diag button:hover{border-color:var(--line-strong)}
.diag button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.diag .n{font-family:var(--mono);font-size:20px;font-weight:600}
.diag .h{font-size:11.5px;color:var(--ink-3)}
.diag .wk{line-height:1.5}
details.rules{border-top:1px solid var(--line);padding:10px 14px;font-size:12.5px;color:var(--ink-2)}
details.rules summary{cursor:pointer;font-weight:600;color:var(--ink)}
details.rules ul{margin:8px 0 2px;padding-left:18px;display:grid;gap:4px;max-width:90ch}
.lb .bar{display:inline-block;height:8px;background:var(--accent);border-radius:2px;vertical-align:middle;margin-right:6px}
.detail td{white-space:normal;background:var(--surface-2);font-size:12px;color:var(--ink-2)}
.detail .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.detail .kv b{color:var(--ink-3);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.nowk{white-space:nowrap}
/* date picker (Triple Whale style) */
.dp{position:relative}
.dp-btn{appearance:none;font:inherit;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius);height:32px;padding:0 10px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.dp-btn svg{width:15px;height:15px;stroke:var(--ink-2);fill:none;stroke-width:1.6;flex:none}
.dp-btn .chev{width:12px;height:12px}
.dp-btn:hover{border-color:var(--ink-3)}
.dp-btn small{font-weight:500;color:var(--ink-3)}
.dp-pop{position:absolute;top:calc(100% + 6px);left:0;z-index:40;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:0 12px 32px rgba(20,20,10,.16),0 2px 6px rgba(20,20,10,.08);display:grid;grid-template-columns:210px auto;max-width:calc(100vw - 32px)}
.dp-pop[hidden]{display:none!important}
.dp-presets{border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.dp-presets button{appearance:none;border:0;background:none;font:inherit;font-size:13.5px;color:var(--ink);text-align:left;padding:7px 10px;gap:10px;border-radius:7px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.dp-presets button:hover{background:var(--surface-2)}
.dp-presets button[aria-checked="true"]{background:var(--surface-2);font-weight:600}
.dp-presets button[aria-checked="true"]::after{content:"";width:12px;height:7px;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(-45deg) translateY(-2px)}
.dp-presets hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.dp-main{padding:14px 16px 6px}
.dp-nav.mob{display:none}
.dp-inputs{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dp-inputs input{flex:1;min-width:0;height:34px;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:7px;padding:0 10px}
.dp-inputs input.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.dp-inputs span{color:var(--ink-3)}
.dp-months{display:grid;grid-template-columns:repeat(2,252px);gap:22px}
.dp-mh{display:flex;align-items:center;justify-content:space-between;height:30px;margin-bottom:4px}
.dp-mh b{font-weight:600;font-size:14px}
.dp-nav{appearance:none;border:0;background:none;width:28px;height:28px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-size:16px;line-height:1}
.dp-nav:hover{background:var(--surface-2)}
.dp-nav:disabled{opacity:.25;cursor:default;background:none}
.dp-grid{display:grid;grid-template-columns:repeat(7,36px);row-gap:2px}
.dp-grid .dow{font-size:11.5px;color:var(--ink-3);text-align:center;height:26px;line-height:26px}
.dp-day{appearance:none;border:0;background:none;font:inherit;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink);height:34px;width:36px;padding:0;cursor:pointer;position:relative}
.dp-day span{position:relative;z-index:1;display:inline-flex;width:32px;height:32px;align-items:center;justify-content:center;border-radius:50%}
.dp-day:hover:not(:disabled) span{background:var(--surface-2)}
.dp-day.in{background:var(--accent-soft)}
.dp-day.start{background:linear-gradient(90deg,transparent 50%,var(--accent-soft) 50%)}
.dp-day.end{background:linear-gradient(90deg,var(--accent-soft) 50%,transparent 50%)}
.dp-day.start.end{background:none}
.dp-day.start span,.dp-day.end span{background:var(--ink)!important;color:var(--bg);font-weight:600}
.dp-day.today span{box-shadow:inset 0 0 0 1.5px var(--accent)}
.dp-day:disabled{color:var(--ink-3);opacity:.45;cursor:default}
.dp-day.blank{visibility:hidden}
.dp-foot{grid-column:1/-1;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;flex-wrap:wrap}
.dp-foot .tz{color:var(--ink-3);font-size:12.5px}
.dp-foot .acts{display:flex;gap:8px}
.dp-foot button{appearance:none;font:inherit;font-weight:600;border-radius:7px;height:34px;padding:0 18px;cursor:pointer}
.dp-cancel{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong)}
.dp-apply{background:var(--ink);color:var(--bg);border:1px solid var(--ink)}
.dp-apply:disabled{opacity:.4;cursor:default}
@media (max-width:760px){
  .dp-pop{grid-template-columns:minmax(0,1fr);position:fixed;left:16px;right:16px;top:auto;bottom:16px;max-height:calc(100vh - 32px);overflow:auto}
  .dp-presets{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap}
  .dp-presets button{padding:6px 10px;font-size:13px}
  .dp-presets button[aria-checked="true"]::after{display:none}
  .dp-presets button[aria-checked="true"]{background:var(--ink);color:var(--bg)}
  .dp-nav.mob{display:inline-block}
  .dp-main,.dp-presets{min-width:0}
  .dp-months{justify-content:center}
  .dp-presets hr{display:none}
  .dp-months{grid-template-columns:252px}
  .dp-months .m2{display:none}
}
/* top-level view switch */
.views{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.view-btn{appearance:none;font:inherit;font-size:14px;font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius);padding:8px 16px;cursor:pointer;display:flex;gap:8px;align-items:center}
.view-btn small{font-weight:500;color:var(--ink-3);font-size:12px}
.view-btn[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.view-btn[aria-selected="true"] small{color:var(--bg);opacity:.7}
body[data-view="output"] .perf-only{display:none!important}
body[data-view="perf"] .out-only{display:none!important}
/* creative output */
.stagecell{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px}
.stagecell.z{color:var(--ink-3)}
.heat td.hc{text-align:center;font-family:var(--mono);font-size:12px;min-width:44px;padding:6px 4px}
.heat td.hc span{display:inline-block;min-width:28px;padding:3px 4px;border-radius:4px}
th.hl,td.hl{background:var(--accent-soft)}
.sel-row td{background:var(--accent-soft)!important}
.who{font-weight:600}
.who small{display:block;font-weight:500;color:var(--ink-3);font-size:11px}
.stchip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.stchip.done{background:var(--good-soft);color:var(--good);border-color:transparent}
.stchip.rfl{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.stchip.rev{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.note{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;color:var(--ink-2);font-size:12px;margin-bottom:14px}
.linkbtn{appearance:none;border:0;background:none;color:var(--accent-ink);font:inherit;font-weight:600;cursor:pointer;padding:0}
@media (max-width:600px){h1{font-size:18px}.tile .v{font-size:20px}input[type=search]{min-width:140px}}
@media (prefers-reduced-motion:no-preference){.meter i,.spendbar i{transition:width .25s ease}}

/* ===================== UX layer =====================
   Layout: sticky app bar (brand · view switch · dates · definitions · theme) → filters + active chips →
   strategist tabs + sticky "jump to" → sections answering one question each (summary, who, why, trend, where, which ads). */
.topbar{position:sticky;top:0;z-index:30;background:var(--bg);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1500px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{width:32px;height:32px;border-radius:8px;display:block;flex:none;object-fit:cover}
.logo-txt{width:32px;height:32px;border-radius:8px;flex:none;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-weight:800;font-size:10.5px;letter-spacing:.04em}
.brand-sw{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;gap:2px;flex:none;margin-left:6px}
.brand-sw a{font-size:12px;font-weight:600;padding:4px 11px;border-radius:999px;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.brand-sw a:hover{background:var(--surface-2,rgba(127,127,127,.12))}
.brand-sw a[aria-current=page]{background:var(--ink);color:var(--bg)}
.brand .ttl{font-weight:700;font-size:15px;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .fresh{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.views{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;margin:0}
.view-btn{border:0;background:none;padding:6px 14px;border-radius:7px;font-size:13.5px;color:var(--ink-2)}
.view-btn:hover{color:var(--ink)}
.view-btn[aria-selected="true"]{background:var(--surface);color:var(--ink);border:0;box-shadow:0 1px 2px rgba(20,20,10,.14),0 0 0 1px var(--line)}
.view-btn[aria-selected="true"] small{color:var(--ink-3);opacity:1}
.tb-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.pc-card{flex:none;display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);background:linear-gradient(rgba(127,127,127,.07),rgba(127,127,127,.07)),var(--surface)}
.pc-card .pc-dom{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-card .pc-hl{font-weight:700;font-size:14px;line-height:1.3;margin-top:2px}
.pc-card .pc-alt{font-size:11.5px;color:var(--muted);margin-top:3px}
.pc-cta{flex:none;margin-left:auto;padding:7px 12px;border-radius:7px;background:rgba(127,127,127,.18);font-size:13px;font-weight:650;color:var(--ink);text-decoration:none;white-space:nowrap}
.pc-empty{padding:28px 16px;font-size:13px;color:var(--muted);line-height:1.5}
.pv-media{background:#000;display:flex;align-items:center;justify-content:center;min-width:280px;min-height:200px}
.pv-media{flex:1;min-height:200px}
.pv-media video,.pv-media img{display:block;max-width:100%;max-height:calc(100vh - 150px);width:auto;height:auto}
.pv-msg{color:#ddd;font-size:13px;padding:40px 28px;text-align:center;line-height:1.5}.pv-msg a{color:#fff;font-weight:600}
.pv-meta{padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--line)}
.pv-title{font-weight:650;font-size:14px;max-width:520px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-sub{font-size:12px;color:var(--muted);margin-top:2px}
.pv-links{display:flex;gap:14px;font-size:12.5px;white-space:nowrap}.pv-links a{color:var(--accent,#2b5fd9);text-decoration:none}
.pv-x,.pv-nav{position:absolute;border:0;cursor:pointer;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;width:36px;height:36px;font-size:18px;line-height:36px;text-align:center;z-index:2}
.pv-x{top:10px;right:10px}.pv-nav{top:calc(50% - 40px)}.pv-prev{left:10px}.pv-next{right:10px}
.pv-x:hover,.pv-nav:hover{background:rgba(0,0,0,.8)}.pv-nav[disabled]{opacity:.25;cursor:default}
.pv-count{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:900px){.pv-box{grid-template-columns:1fr;overflow:auto}.pv-left,.pv-copy{max-height:none}.pv-copy{border-left:0;border-top:1px solid var(--line)}.pc-body{overflow:visible;flex:none}.pv-media video,.pv-media img{max-height:62vh}.pc-head{padding-right:16px}}
@media (max-width:640px){.pv{padding:0}.pv-box{border-radius:0;width:100%;height:100%;max-height:100%}.pv-title{max-width:70vw}}
.adsp{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 4px 0 10px;margin-right:8px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--surface);font-size:13px;color:var(--ink-2);white-space:nowrap}.adsp.on{border-color:var(--accent);color:var(--ink)}.adsp input{width:70px;border:0;background:none;font:inherit;font-weight:600;color:var(--ink);outline:none;padding:0 2px}.adsp button{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:12px;padding:2px 4px}
.adq-wrap{position:relative;display:flex;align-items:center;margin-right:8px}
.adq-wrap svg{position:absolute;left:10px;color:var(--ink-3);pointer-events:none}
#adq{height:32px;width:220px;padding:0 28px 0 30px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px;outline:none}
#adq:focus{border-color:var(--accent-ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent-ink) 18%,transparent)}
#adq::-webkit-search-cancel-button{display:none}
#adq-x{position:absolute;right:6px;border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:12px;padding:4px}
@media (max-width:640px){.adq-wrap{flex:1;margin:0 0 8px}#adq{width:100%}}
.bd-note{margin:0;padding:8px 14px 12px;font-size:11.5px;color:var(--ink-3);border-top:1px solid var(--line)}
.set-grid{display:grid;grid-template-columns:1fr 120px;gap:10px 14px;align-items:center;font-size:12.5px}
.set-grid label{color:var(--ink)}.set-grid label small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:1px}
.set-grid input{width:100%;font-family:var(--mono);text-align:right}
.set-foot{background:var(--surface);border-top:1px solid var(--line);padding:12px 0 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.set-foot .primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.set-status{font-size:12px;color:var(--ink-3);flex-basis:100%}.set-status.ok{color:var(--good)}.set-status.bad{color:var(--crit)}
.set-dirty{font-size:11.5px;color:var(--warn);font-weight:600}
</style>

/* re-render without jumping: keep page + table scroll positions while the DOM is swapped */
function render(){
  const sy=window.scrollY, hosts=[$('#view'),$('#oview')].filter(Boolean);
  const sx=[...document.querySelectorAll('#view *, #oview *')].filter(e=>e.scrollLeft>0).map(e=>{const tb=e.querySelector('table[id]');return [tb?tb.id:null,e.scrollLeft]}).filter(x=>x[0]);
  hosts.forEach(h=>h.style.minHeight=h.offsetHeight+'px');
  try{_render()}finally{
    for(const [k,x] of sx){const tb=document.getElementById(k);if(tb&&tb.parentElement)tb.parentElement.scrollLeft=x}
    hosts.forEach(h=>h.style.minHeight='');
    window.scrollTo(0,Math.min(sy,document.documentElement.scrollHeight-innerHeight));
  }
}

const fx2=v=>(+v).toFixed(2);
function winTxt(){return `NC ROAS ≥ ${fx2(CFG.winRoas)}`+(CFG.winCpa>0?` or NC CPA ≤ $${CFG.winCpa}`:'')}
function potTxt(){return `${fx2(CFG.potRoas)}–${fx2(CFG.winRoas-0.01)}`}
/* ---------- leaderboard rules ----------
   MIN_TESTED   : tested ads (>= min spend in range) needed before a strategist is ranked.
   Rank score   : CREATIVE SCORE (spend-weighted hit rate) = spend on winning ads ÷ spend on tested ads, so a $6K winner
                  counts more than a $300 one and an expensive loser hurts more than a cheap one.
   PRIOR_SPEND  : $ of "team average" tested spend each record is blended with (Bayesian shrinkage), so one
                  big winner on a thin record can't jump to #1. Score = (winner$ + PRIOR_SPEND*team) / (tested$ + PRIOR_SPEND).
   Range        : 90% Wilson interval on the count hit rate — how sure we are about it. */
const LB={get MIN_TESTED(){return CFG.minTested},get PRIOR_SPEND(){return CFG.priorSpend},get PRIOR_ADS(){return CFG.priorAds||30}};
function wilson(w,n,z=1.645){if(!n)return [0,1];const p=w/n,d=1+z*z/n,c=p+z*z/(2*n),m=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n));return [Math.max(0,(c-m)/d),Math.min(1,(c+m)/d)]}
function leaderboard(all){
  const people=stratKeys.filter(k=>!BUCKET(k));
  const money=l=>{let ts=0,ws=0;for(const x of l){if(x.m.stage==='untested')continue;ts+=x.m.spend;if(x.m.stage==='winner')ws+=x.m.spend}return {ts,ws,sw:ts?ws/ts:0}};
  const teamL=all.filter(x=>people.includes(x.ad.strat));
  const team=summarize(teamL);Object.assign(team,money(teamL));
  const p0=team.ts?team.ws/team.ts:0;
  const rows=stratKeys.map(k=>{const mine=all.filter(x=>x.ad.strat===k);const s=summarize(mine);Object.assign(s,money(mine));
    /* Creative Score = ½ efficiency + ½ scale (0–1, shown ×100)
       efficiency (q)  = NC ROAS ÷ winner line, capped at 1.5 so a tiny high-ROAS spend can't dominate
       scale (impact)  = this strategist's share of the team's ad spend */
    const q=Math.min(1.5,(s.spend?s.ncRoas:0)/CFG.winRoas);const impact=team.spend?s.spend/team.spend:0;
    const score=0.5*q+0.5*impact;
    const [lo,hi]=wilson(s.winner,s.tested);
    const conf=s.tested>=30?['hi','High']:s.tested>=10?['md','Medium']:['lo','Low'];
    const cs=pool(all.filter(x=>x.ad.strat===k).map(x=>x.m));
    return {k,s,cs,score,q,impact,lo,hi,conf,person:people.includes(k),ranked:people.includes(k)&&s.tested>=LB.MIN_TESTED}}).filter(r=>r.s.n>0);
  const by=(a,b)=>b.score-a.score||b.s.spend-a.s.spend||b.s.ws-a.s.ws;
  const ranked=rows.filter(r=>r.ranked).sort(by);ranked.forEach((r,i)=>r.rank=i+1);
  const unranked=rows.filter(r=>r.person&&!r.ranked).sort((a,b)=>b.s.tested-a.s.tested||b.s.winner-a.s.winner||b.s.spend-a.s.spend);
  const other=rows.filter(r=>!r.person);
  const act=rows.filter(r=>r.person&&r.s.tested>0);const avg=act.length?act.reduce((a,r)=>a+r.score,0)/act.length:0;
  return {ranked,unranked,other,p0,avg,team,all:rows};
}

function kpi(label,val,desc,o={}){const km=KPI_M[label];return `<div class="kpi ${o.cls||''}${km?' kpi-click':''}${km&&ui2.kpiM===km?' kpi-sel':''}"${km?` data-m="${km}" role="button" tabindex="0" title="Show ${esc(label)} over time"`:''}><div class="eyebrow">${label}${o.d||''}</div><div class="v ${o.vcls||''}">${val}</div>${desc?`<div class="d">${desc}</div>`:''}${o.extra||''}</div>`}
function roasTone(v){return v>=CFG.winRoas?'g':v>=CFG.potRoas?'w':'r'}
function mixBar(S){const seg=(n,c,l)=>n?`<i style="flex:${n};background:var(--${c})" title="${n} ${l}"></i>`:'';
  return `<div class="mix" role="img" aria-label="${S.winner} winners, ${S.potential} potential, ${S.loser} losers">${seg(S.winner,'good','winners')}${seg(S.potential,'warn','potential')}${seg(S.loser,'crit','losers')}</div>`}
function kpiRows(S,o){return kpiHero(S,o)+kpiSecondary(S,o)}
function kpiHero(S,o,cls=''){

  h+=kpi('Hit rate',fmtP(S.hit),o.hitDesc,{cls:'hit',d:PS&&PS.tested&&dl(S.hit,PS.hit),extra:`<div class="meter"><i style="width:${Math.min(100,S.hit*100)}%"></i></div>`});

    h+=kpi('Creative Score',n?fmtS(o.L.avg):'—',n?`team average · ${n} strategists with tested ads · ${o.L.ranked.length} ranked`:'no tested ads yet',{d:PRV&&dl(o.L.avg,PRV.L.avg),extra:`<div class="meter"><i style="width:${Math.min(100,(o.L.avg||0)*100)}%"></i></div>`});

/* Creative Score card: share of tested spend that went to winners, 0–100, coloured vs the weekly target */
function scoreKpi(S,r){
  if(r)return kpi('Creative Score',r.s.tested?fmtS(r.score):'—',r.s.tested?`NC ROAS ${fmtX(r.s.ncRoas)} → efficiency ${fmtS(r.q)} · ${fmtP(r.impact)} of team spend`:'no tested ads yet',{d:PRV&&PRV.me&&PRV.me.s.tested&&r.s.tested&&dl(r.score,PRV.me.score),extra:`<div class="meter"><i style="width:${Math.min(100,r.score*100)}%"></i></div>`});
  const t=CFG.tgtSw||0.2,tone=!S.ts?'':S.sw>=t?'g':S.sw>=t*0.6?'w':'r';
  return kpi('Spend on winners',S.ts?fmtP(S.sw):'—',S.ts?`${fmtM(S.ws)} of ${fmtM(S.ts)} tested spend`:'no tested spend yet',{vcls:tone?'roas-'+tone:'',d:PRV&&PRV.S.ts&&S.ts&&dl(S.sw,PRV.S.sw),extra:`<div class="meter"><i style="width:${Math.min(100,S.sw*100)}%"></i></div>`})}
/* brief → ready under 15 tasks is too few to read on its own */
const SPEED_MIN=15;function lowS(n){return n&&n<SPEED_MIN?` <span class="lows" title="Only ${n} task${n>1?'s':''} reached Ready for launch in this range; pick a longer range (4 weeks for one strategist) for a reliable number">low sample</span>`:''}
/* store-wide blended stats from Triple Whale (all channels, whole store; not split by product or strategist) */
function blendedFor(d1,d2){const B=DATA.blended;if(!B)return null;let sp=0,rv=0,nc=0,no=0,nn=0,n=0;for(const k in B){if(k>=d1&&k<=d2){sp+=B[k][0];rv+=B[k][1];nc+=B[k][2];if(B[k][3]!=null){no+=B[k][3];nn++}n++}}return n&&sp?{sp,rv,nc,no:nn===n?no:null}:null}
/* New briefs card (ClickUp): tasks created in For production in range + avg days brief → Ready for launch */
function briefStats(k){
  if(typeof OUT==='undefined'||!OUT)return null;
  const T=OUT.T||OUT.tasks.map(r=>Object.fromEntries(OUT.cols.map((c,i)=>[c,r[i]])));
  const pOk=t=>!state.product||t.product===state.product||t.product==='Cacao + Natto';
  const mine=T.filter(t=>pOk(t)&&(!k||t.strat===k));
  if(k&&!mine.length)return {none:true};
  const nb=mine.filter(t=>t.brief&&inRange(t.brief)).length;
  const sp=mine.filter(t=>t.speed!=null&&t.ready&&inRange(t.ready));
  return {nb,n:sp.length,avg:sp.length?sp.reduce((a,t)=>a+t.speed,0)/sp.length:null}}
function briefKpi(k){
  const b=briefStats(k);if(!b)return '';
  if(b.none)return kpi('New briefs','—','not tracked in ClickUp');

function kpiSecondary(S,o){

function rankRulesHTML(){return `<ul>
    <li><b>Tested</b> = ads that spent at least $${state.min} in the selected range. Winner = ${winTxt()} over that range.</li>
    <li><b>Minimum sample:</b> a strategist needs ${LB.MIN_TESTED} tested ads in the range to get a rank. Below that they're listed under "Not ranked yet", with the same stats, so nobody is hidden.</li>
    <li><b>Creative Score</b> (0–100, what the rank uses) = ½ <b>efficiency</b> + ½ <b>scale</b>.</li>
    <li><b>Efficiency</b> = the strategist's Meta TW NC ROAS ÷ the ${fmtX(CFG.winRoas)} winner line, over all their spend in the range. At the winner line it scores 100; it's capped at 150 so a small, lucky spend can't dominate.</li>
    <li><b>Scale</b> = this strategist's share of the team's ad spend. Budget follows what works, so a bigger share means more of the account is running on their creative. Spending a lot at a poor NC ROAS still pulls the efficiency half down.</li>
    <li><b>Spend on winners</b> and <b>hit rate</b> are still shown for each strategist, they just don't decide the rank.</li>
    <li><b>Hit rate</b> (count) is still shown: winners ÷ tested ads.</li>
    <li><b>Range under the hit rate</b> is the 90% interval on the count hit rate: wide range = few ads, treat with caution. <b>Confidence</b>: Low under 10 tested, Medium 10–29, High 30+.</li>
    <li><b>Ties</b> go to more winner spend, then more winners. Spend is partly the media buyer's call (a winner only gets big if it's scaled), so read short ranges with care and prefer 30+ days. <b>Team average</b> uses named strategists only; Unassigned (ads not following the naming SOP) is shown but never ranked.</li>
    <li>In the bar: Creative Score, thin line = team average (mean of strategists with tested ads).</li>
    <li><b>Avg hook / hold / CTR</b> pool every ad of that strategist with ${fmtN(CR.MIN_IMP)}+ impressions in the range (Σ 3-sec views ÷ Σ impressions, Σ ThruPlays ÷ Σ 3-sec views, Σ link clicks ÷ Σ impressions), so bigger ads weigh more. Green/red = at least 10% above/below the account average for the same dates. These don't affect the rank; they explain it.</li></ul>`}
function lbCompact(L){

  if(L.ranked.length){
    h+='<ol class="lbc-list">';
    for(const r of L.ranked)h+=`<li data-go="${r.k}" tabindex="0" title="Open ${esc(DATA.strats[r.k])}">
      <span class="lbc-rk">#${r.rank}</span>
      <span class="lbc-nm"><i style="background:${colorOf(r.k)}"></i>${esc(DATA.strats[r.k])}<small>${fmtX(r.s.ncRoas)} NC ROAS · ${fmtP(r.impact)} of team spend · ${r.s.winner}/${r.s.tested} winners · <span class="conf ${r.conf[0]}" title="How much to trust this score: based on the number of tested ads (Low under 10, Medium 10–29, High 30+)">Confidence: ${r.conf[1]}</span></small></span>

function lbTable(L){ // sorts within each section; rank numbers never change

    +'</tr></thead><tbody>';

  if(L.unranked.length){h+=`<tr class="sec"><td colspan="15">Not ranked yet · fewer than ${LB.MIN_TESTED} tested ads in this range</td></tr>`;for(const r of L.unranked)h+=lbRow(r,L.avg,'unranked')}

/* Breakdown is strict: only codes from the naming SOP are shown. Case is ignored; for ad type the

const SOP={
  angle:{BF:'BF',AB:'AB',BP:'BP',P:'P',NEURO:'Neuro',BR:'BR',NE:'NE',WP:'WP',MP:'MP',CE:'CE',CH:'CH',GH:'GH',NO:'NO',GF:'GF',BS:'BS',PR:'PR',MD:'MD',SL:'SL',ED:'ED',TS:'TS',TH:'TH',CO:'CO'},   // TH thyroid, CO constipation (AVIA)

  adtype:{'UGC':'UGC','VSL':'VSL','AI UGC':'AI UGC','AI ANIM.':'AI Animation','AI ANIMATION':'AI Animation','AI AUTH.':'AI Authority','AI AUTHORITY':'AI Authority'}
};
function sopCode(dim,v){return SOP[dim][String(v||'').trim().replace(/\s+/g,' ').toUpperCase()]||null}
function breakdownPanels(all){
  const dims=[['angle','By angle','Angle'],['aware','By awareness','Awareness'],['adtype','By ad type','Ad type']];
  const get={key:r=>r.key,tested:r=>r.s.tested,winner:r=>r.s.winner,hit:r=>r.s.hit,spend:r=>r.s.spend,ncRoas:r=>r.s.ncRoas};

    h+=sortTh(colName,'key',st,'data-bd-'+d,'l')+sortTh('Tested','tested',st,'data-bd-'+d)+sortTh('Win','winner',st,'data-bd-'+d)+sortTh('Hit','hit',st,'data-bd-'+d)+sortTh('Spend','spend',st,'data-bd-'+d)+sortTh('NC ROAS','ncRoas',st,'data-bd-'+d);

function weeklyChart(all,onlyStrat){
  const wk=buckets();
  const series=(onlyStrat?[onlyStrat]:stratKeys.filter(k=>!BUCKET(k))).map(k=>({k,pts:wk.map(w=>{const l=all.filter(x=>x.ad.strat===k).map(x=>({ad:x.ad,m:classify(x.ad,w.d1,w.d2,state.min)})).filter(x=>x.m.stage!=='untested');const win=l.filter(x=>x.m.stage==='winner').length;return {w:w.label,tested:l.length,win,hit:l.length?win/l.length:0}})})).filter(s=>s.pts.some(p=>p.tested));
  if(!wk.length||!series.length)return '<div class="empty">No ads reached $'+state.min+' spend inside any single bucket of this range</div>';
  const W=onlyStrat?520:1150,H=onlyStrat?200:230,pl=36,pr=8,pt=12,pb=30,iw=W-pl-pr,ih=H-pt-pb;
  const gw=iw/wk.length,bw=Math.min(28,(gw-10)/series.length);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:100%;height:auto;display:block" role="img" aria-label="Weekly hit rate">`;
  for(const t of [0,.25,.5,.75,1]){const y=pt+ih-t*ih;s+=`<line class="tick" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${t*100}%</text>`}
  const step=Math.ceil(wk.length/8);wk.forEach((w,i)=>{if(i%step===0||wk.length<=8)s+=`<text x="${pl+gw*i+gw/2}" y="${H-8}" text-anchor="middle">${esc(w.label)}</text>`});
  series.forEach((se,si)=>{se.pts.forEach((p,i)=>{if(!p.tested)return;const x=pl+gw*i+(gw-bw*series.length)/2+si*bw;const h=Math.max(2,p.hit*ih);const y=pt+ih-h;s+=`<rect x="${x+1}" y="${y}" width="${bw-2}" height="${h}" rx="3" fill="${colorOf(se.k)}" data-tt="${esc(DATA.strats[se.k])} · ${esc(p.w)}&lt;br&gt;&lt;b&gt;${fmtP(p.hit)}&lt;/b&gt; hit rate · ${p.win}/${p.tested} winners"/>`;if(series.length<=3)s+=`<text x="${x+bw/2}" y="${y-4}" text-anchor="middle" style="font-family:var(--mono);font-size:10px">${(p.hit*100).toFixed(0)}%</text>`})});
  s+=`<line class="axis" x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}"/></svg>`;
  if(series.length>1)s+='<div class="meta" style="margin-top:6px">'+series.map(se=>`<span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${colorOf(se.k)};margin-right:4px;vertical-align:-1px"></i>${esc(DATA.strats[se.k])}</span>`).join('')+'</div>';
  return s;
}

function scatter(all){
  const pts=all.filter(x=>x.m.stage!=='untested');
  if(!pts.length)return '<div class="empty">No tested ads</div>';
  const W=520,H=200,pl=40,pr=10,pt=10,pb=30,iw=W-pl-pr,ih=H-pt-pb;
  const maxS=Math.max(...pts.map(p=>p.m.spend)),maxR=Math.max(1.2,...pts.map(p=>p.m.ncRoas));
  const sx=v=>pl+Math.sqrt(v/maxS)*iw,sy=v=>pt+ih-(v/maxR)*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:100%;height:auto;display:block" role="img" aria-label="NC ROAS vs spend">`;
  for(const t of [0,0.5,1,1.5,2,3,4].filter(t=>t<=maxR)){const y=sy(t);s+=`<line class="tick" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${t.toFixed(1)}×</text>`}
  s+=`<line x1="${pl}" x2="${W-pr}" y1="${sy(CFG.winRoas)}" y2="${sy(CFG.winRoas)}" stroke="var(--good)" stroke-dasharray="4 3"/><text x="${W-pr}" y="${sy(CFG.winRoas)-4}" text-anchor="end" style="fill:var(--good)">${CFG.winRoas.toFixed(2)} winner line</text>`;
  s+=`<text x="${pl+iw/2}" y="${H-6}" text-anchor="middle">spend (sqrt scale) → ${fmtM(maxS)}</text>`;
  const col={winner:'var(--good)',potential:'var(--warn)',loser:'var(--crit)'};
  for(const p of pts){s+=`<circle cx="${sx(p.m.spend).toFixed(1)}" cy="${sy(Math.min(p.m.ncRoas,maxR)).toFixed(1)}" r="5" fill="${col[p.m.stage]}" stroke="var(--surface)" stroke-width="1.5" data-tt="${esc(p.ad.title)}&lt;br&gt;&lt;b&gt;${fmtX(p.m.ncRoas)}&lt;/b&gt; NC ROAS · ${fmtM(p.m.spend)} spend · ${p.m.ncCpa!=null?fmtM2(p.m.ncCpa)+' NC CPA':'no NC purchases'}"/>`}
  s+=`<line class="axis" x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}"/></svg>`;
  return s;
}

const _CAMP={};function campDaily(c){if(_CAMP[c])return _CAMP[c];const t={};for(const a of DATA.ads){if(a.campaign!==c)continue;for(const d in a.d)t[d]=(t[d]||0)+(a.d[d][0]||0)}return _CAMP[c]=t}

function adMatch(ad,terms){const s=(ad.title+' '+ad.name+' '+ad.adset+' '+ad.campaign+' '+ad.id).toLowerCase();return terms.every(w=>s.includes(w))}

    list.sort(ost.ts.k==='status'||ost.ts.k==='date'?((a,b)=>{const x=tg(a),y=tg(b);if(x==null)return 1;if(y==null)return -1;return (x<y?1:x>y?-1:0)*(ost.ts.k==='status'?-1:1)*(ost.ts.d<0?1:-1)}):cmpBy(tg,ost.ts.d))}
  const selName=ost.sel?(ost.group==='strat'?oname(ost.sel):ost.sel):null;
  h+=secH(selName?esc(selName)+' — tasks':'All tasks',`${list.length} tasks${ost.sel?' · <button class="linkbtn" id="oclear">show everyone</button>':''}`);
  h+='<div class="seg" id="ostage" style="margin:6px 0 10px"><button data-v="" aria-pressed="'+(!ost.stage)+'">All</button><button data-v="completee" aria-pressed="'+(ost.stage==='completee')+'">Published</button>'+PIPE.slice().reverse().map(p=>`<button data-v="${p[0]}" aria-pressed="${ost.stage===p[0]}">${p[1]}</button>`).join('')+'</div>';
  h+='<div class="tbl-wrap"><table style="min-width:900px"><thead><tr>'+sortTh('Task','title',ost.ts,'data-tk','l')+sortTh('Strategist','strat',ost.ts,'data-tk','l')+sortTh('Video editor(s)','editors',ost.ts,'data-tk','l')+sortTh('List','product',ost.ts,'data-tk','l')+sortTh('Status','status',ost.ts,'data-tk','l','Pipeline order')+sortTh('Date','date',ost.ts,'data-tk','','Completed date for uploads, last update otherwise')+'</tr></thead><tbody>';
  for(const t of list.slice(0,ost.lim))h+=`<tr><td class="l" style="white-space:normal;max-width:460px"><a href="${esc(t.url)}" target="_blank" rel="noopener" style="color:var(--ink);font-weight:600;text-decoration:none" title="Open in ClickUp: ${esc(t.name)}">${esc(t.title)}</a> <a class="cu-link" href="${esc(t.url)}" target="_blank" rel="noopener" title="Open this task in ClickUp">↗ ClickUp</a>${t.frameio?` <a class="cu-link" href="${esc(t.frameio)}" target="_blank" rel="noopener" title="Open the edit on Frame.io">▶ Frame.io</a>`:''}<div class="meta">${esc(t.name.length>110?t.name.slice(0,110)+'…':t.name)}</div></td><td class="l">${esc(oname(t.strat))}</td><td class="l" style="white-space:normal">${t.editors.length?esc(t.editors.join(', ')):'<span style="color:var(--ink-3)">—</span>'}</td><td class="l">${esc(t.product)}</td><td class="l">${stChip(t.status)}</td><td class="num" title="${t.status==='completee'?'Completed':'Last updated'}">${t.status==='completee'?(t.closed?fmtD(t.closed):'—'):(t.updated?fmtD(t.updated)+' <span style="color:var(--ink-3)">upd.</span>':'—')}</td></tr>`;
  if(!list.length)h+='<tr><td colspan="6" class="empty">No tasks</td></tr>';
  h+='</tbody></table></div>';
  if(list.length>ost.lim)h+=`<p style="text-align:center"><button class="tbtn" id="omore">Show ${Math.min(100,list.length-ost.lim)} more of ${list.length-ost.lim}</button></p>`;
  $('#oview').innerHTML=h;
  $('#foot').innerHTML=`<b>How this is counted.</b> Strategist is read from the end of the ClickUp task name (SOP: Angle | Awareness | Name | Type | Product | Strategist). Video editor = the task's assignees minus strategists, admin, Brandon and the media buyer; duplicate Soban Khan accounts are merged. Source: ClickUp ${BRAND.toUpperCase()} › ${OUT.T.some(t=>t.kind==='Static')?'Video + Static Ads (static statuses mapped: ready for design = For production, in design = In edit, internal review / copywriting added = Pre-launch review, revision(s needed) = Revisions, final approval / ready to upload = Ready for launch, testing / scheduled = Published)':'Video Ads'}, ${OUT.tasks.length} tasks, pulled ${OUT.generated}.`;
  document.querySelectorAll('#otbl th[data-ok]').forEach(th=>th.onclick=()=>{const k=th.dataset.ok;if(ost.sort===k)ost.dir=-ost.dir;else{ost.sort=k;ost.dir=-1}render()});
  document.querySelectorAll('#otbl tr[data-ok]').forEach(tr=>tr.onclick=()=>{ost.sel=ost.sel===tr.dataset.ok?null:tr.dataset.ok;ost.lim=60;render()});
  const c=$('#oclear');if(c)c.onclick=()=>{ost.sel=null;render()};
  const m=$('#omore');if(m)m.onclick=()=>{ost.lim+=100;render()};
  document.querySelectorAll('#oview [data-open-defs]').forEach(b=>b.onclick=()=>openDefs(b.dataset.openDefs));
  document.querySelectorAll('th[data-hk]').forEach(th=>th.onclick=()=>{toggleSort(ost.hs,th.dataset.hk);render()});
  document.querySelectorAll('th[data-tk]').forEach(th=>th.onclick=()=>{const k=th.dataset.tk;if(ost.ts.k===k)ost.ts.d=-ost.ts.d;else{ost.ts.k=k;ost.ts.d=-1}render()});
  document.querySelectorAll('#ostage button').forEach(b=>b.onclick=()=>{ost.stage=b.dataset.v;ost.lim=60;render()});
}
function setView(v){VIEW=v;setTimeout(dockDp,0);T=pd(anchorFor(v));DP.close(false);
  if(state.range!=='custom'){[state.d1,state.d2]=rangeFor(state.range)}
  else{const [lo,hi]=DP.bounds();if(state.d2>hi)state.d2=hi;if(state.d1<lo)state.d1=lo;if(state.d1>state.d2)state.d1=state.d2}
  DP.label();
  try{history.replaceState(null,'','#'+(v==='output'?'output':state.tab))}catch(e){}render()}
document.querySelectorAll('.view-btn').forEach(b=>b.onclick=()=>setView(b.dataset.view));
if(OUT&&OUT.T.some(t=>t.kind==='Static'))$('#okind').style.display='';
for(const [id,key] of [['okind','kind'],['oproduct','product'],['ogroup','group']]){$('#'+id).querySelectorAll('button').forEach(b=>b.onclick=()=>{ost[key]=b.dataset.v;if(key==='group')ost.sel=null;$('#'+id).querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()})}
$('#oq').oninput=e=>{ost.q=e.target.value;render()};
buildFilters();

if(VIEW==='output'){state.range='30d';setView('output')}else{DP.label();render()}

/* ---------- creative preview (lightbox) ----------
   Nothing loads until an ad is opened: the <video>/<img> element is created on open and
   destroyed on close, so the page itself carries zero extra weight. Cmd/Ctrl/middle-click
   still opens the file in a new tab. ←/→ step through the ads in the current table order. */
const PV={el:null,list:[],i:0,byId:null,
  ad(id){if(!this.byId){this.byId=new Map();for(const a of DATA.ads)this.byId.set(a.id,a)}return this.byId.get(id)},
  build(){
    const d=document.createElement('div');d.className='pv';d.hidden=true;d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.setAttribute('aria-label','Creative preview');
    d.innerHTML=`<div class="pv-box"><button class="pv-x" aria-label="Close preview">✕</button><div class="pv-left"><button class="pv-nav pv-prev" aria-label="Previous ad">‹</button><button class="pv-nav pv-next" aria-label="Next ad">›</button><div class="pv-media"></div><div class="pv-meta"><div style="min-width:0"><div class="pv-title"></div><div class="pv-sub"></div></div><div class="pv-links"></div></div></div><aside class="pv-copy" aria-label="Ad copy"></aside></div>`;
    document.body.appendChild(d);this.el=d;
    d.addEventListener('click',e=>{if(e.target===d||e.target.closest('.pv-x'))this.close();else if(e.target.closest('.pv-prev'))this.step(-1);else if(e.target.closest('.pv-next'))this.step(1)});
    document.addEventListener('keydown',e=>{if(!this.el||this.el.hidden)return;if(e.key==='Escape'){e.stopPropagation();this.close()}else if(e.key==='ArrowLeft')this.step(-1);else if(e.key==='ArrowRight')this.step(1)},true);
  },
  open(id,kind){
    if(!this.el)this.build();
    this.list=[...document.querySelectorAll('#adtbl tbody tr[data-id]')].map(r=>r.dataset.id).filter(x=>{const a=this.ad(x);return a&&(a.video||a.img)});
    this.i=Math.max(0,this.list.indexOf(id));if(!this.list.length)this.list=[id];
    this.kind=kind;this.ret=document.activeElement;
    this.show();this.el.hidden=false;document.documentElement.style.overflow='hidden';this.el.querySelector('.pv-x').focus();
  },
  show(){
    const ad=this.ad(this.list[this.i]);if(!ad)return;const m=this.el.querySelector('.pv-media');this.unload();
    const useImg=!ad.video||(this.kind==='img'&&ad.img);const src=useImg?(thumbSrc(ad)||ad.img):ad.video;
    const fail=()=>{m.innerHTML=`<div class="pv-msg"><b style="color:#fff">${useImg?'Image':'Video'} can't load in the Claude-hosted version</b><br>Claude blocks media from other sites, including Triple Whale.<br>On your Vercel site it ${useImg?'shows':'plays'} right here.<br><br><a href="${esc(src)}" target="_blank" rel="noopener">Open it in a new tab ↗</a></div>`};
    if(useImg){const im=document.createElement('img');im.alt='';im.decoding='async';im.onerror=fail;im.src=src;m.appendChild(im)}
    else{const v=document.createElement('video');v.controls=true;v.autoplay=true;v.playsInline=true;v.preload='auto';const p=thumbSrc(ad);if(p)v.poster=p;v.onerror=fail;v.src=src;m.appendChild(v)}
    this.kind=null;
    this.el.querySelector('.pv-title').textContent=ad.title||ad.name;
    this.el.querySelector('.pv-sub').textContent=[ad.angle,ad.aware,ad.adtype,ad.product,ad.fmt,(DATA.strats[ad.strat]||ad.strat),(ad.status||'').replace(/_/g,' ').toLowerCase()].filter(x=>x&&x!=='—').join(' · ');
    this.el.querySelector('.pv-links').innerHTML=`<span class="pv-count">${this.list.length>1?`${this.i+1} / ${this.list.length}`:''}</span>${ad.video&&!useImg?'':ad.video?`<a href="#" data-pv-play>▶ Play video</a>`:''}${ad.video?`<a href="${esc(ad.video)}" target="_blank" rel="noopener">Open in new tab ↗</a>`:(ad.img?`<a href="${esc(ad.img)}" target="_blank" rel="noopener">Open in new tab ↗</a>`:'')}${ad.url?`<a href="${esc(ad.url)}" target="_blank" rel="noopener">Ads Manager ↗</a>`:''}`;
    const pl=this.el.querySelector('[data-pv-play]');if(pl)pl.onclick=e=>{e.preventDefault();this.show()};
    this.copy(ad);
    this.el.querySelector('.pv-prev').disabled=this.i<=0;this.el.querySelector('.pv-next').disabled=this.i>=this.list.length-1;
  },
  /* ad copy: copy.json sits next to the page and is fetched once, the first time a preview opens */
  cp:null,cpTry:null,
  loadCopy(){if(!this.cpTry)this.cpTry=fetch('copy.json').then(r=>r.ok?r.json():null).catch(()=>null).then(j=>{this.cp=j;return j});return this.cpTry},
  copy(ad){
    const box=this.el.querySelector('.pv-copy');const id=ad.id;
    if(!this.cp){box.innerHTML='<div class="pc-head"><span class="pc-lbl">Ad copy</span></div><div class="pc-empty">Loading copy…</div>';
      this.loadCopy().then(j=>{if(this.ad(this.list[this.i])===ad)j?this.copy(ad):box.innerHTML=`<div class="pc-head"><span class="pc-lbl">Ad copy</span></div><div class="pc-empty">Ad copy isn't available here. It shows on the Vercel dashboard.</div>`});return}
    const x=this.cp.a[id];
    if(!x){box.innerHTML='<div class="pc-head"><span class="pc-lbl">Ad copy</span></div><div class="pc-empty">No copy saved for this ad yet. It is pulled from Triple Whale overnight.</div>';return}
    const texts=x[0].map(h=>this.cp.t[h]).filter(Boolean),heads=x[1]||[],cta=x[2]||'',url=x[3]||'';
    const ctaTxt=cta?cta.toLowerCase().replace(/_/g,' ').replace(/^./,c=>c.toUpperCase()):'';
    let dom='';try{dom=url?new URL(url).hostname.replace(/^www\./,''):''}catch(e){}
    let k=Math.min(this.cpK||0,Math.max(0,texts.length-1));const LIM=700;
    const render=()=>{
      const t=texts[k]||'',long=t.length>LIM&&!this.cpOpen;
      box.innerHTML=`<div class="pc-head"><span class="pc-lbl">Ad copy</span>${texts.length>1?`<span class="pc-tabs" role="group" aria-label="Text variations">${texts.map((_,i)=>`<button type="button" data-k="${i}" aria-pressed="${i===k}">Text ${i+1}</button>`).join('')}</span>`:''}<button type="button" class="pc-btn" data-copy>Copy</button></div>`
        +`<div class="pc-body">${t?esc(long?t.slice(0,LIM).replace(/\s+\S*$/,'')+'…':t):'<span style="color:var(--muted)">No primary text</span>'}${long?'<button type="button" class="pc-more" data-more>See more</button>':''}${t?`<div class="pc-len">${fmtN(t.length)} characters · ${fmtN((t.match(/\S+/g)||[]).length)} words${texts.length>1?` · ${texts.length} text variations (dynamic creative)`:''}</div>`:''}</div>`
        +(heads.length||ctaTxt||dom?`<div class="pc-card"><div style="min-width:0">${dom?`<div class="pc-dom">${esc(dom)}</div>`:''}${heads[0]?`<div class="pc-hl">${esc(heads[0])}</div>`:''}${heads.length>1?`<div class="pc-alt" title="${esc(heads.slice(1).join('\n'))}">+${heads.length-1} more headline${heads.length>2?'s':''}: ${esc(heads.slice(1).join(' · '))}</div>`:''}</div>${ctaTxt?(url?`<a class="pc-cta" href="${esc(url)}" target="_blank" rel="noopener" title="Open the landing page">${esc(ctaTxt)}</a>`:`<span class="pc-cta">${esc(ctaTxt)}</span>`):''}</div>`:'');
      box.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{k=this.cpK=+b.dataset.k;this.cpOpen=false;render()});
      const mo=box.querySelector('[data-more]');if(mo)mo.onclick=()=>{this.cpOpen=true;render()};
      const cb=box.querySelector('[data-copy]');cb.onclick=()=>{const all=[t,heads[0]].filter(Boolean).join('\n\n');(navigator.clipboard?navigator.clipboard.writeText(all):Promise.reject()).then(()=>{cb.textContent='Copied ✓';setTimeout(()=>{cb.textContent='Copy'},1400)},()=>{cb.textContent='Select & copy';const b=box.querySelector('.pc-body');const r=document.createRange();r.selectNodeContents(b);const sl=getSelection();sl.removeAllRanges();sl.addRange(r)})};
    };
    this.cpOpen=false;render();
  },
  step(d){const j=this.i+d;if(j<0||j>=this.list.length)return;this.i=j;this.show()},
  unload(){const m=this.el&&this.el.querySelector('.pv-media');if(!m)return;const v=m.querySelector('video');if(v){v.pause();v.removeAttribute('src');v.load()}m.innerHTML=''},
  close(){if(!this.el)return;this.unload();this.el.hidden=true;document.documentElement.style.overflow='';if(this.ret&&this.ret.focus)this.ret.focus({preventScroll:true})}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-pv]');if(!a)return;e.preventDefault();e.stopPropagation();PV.open(a.dataset.pv,a.dataset.pvk)},true);
</script>
