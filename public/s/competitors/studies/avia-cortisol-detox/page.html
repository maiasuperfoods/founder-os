<style>
@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap');
#dash-root{--dash-gutter:0}
.ci{--bg:#f5f6f8;--panel:#fff;--panel-2:#f1f3f6;--ink:#14161b;--ink-2:#3a404b;--muted:#646b78;--line:#e3e6eb;--line-2:#cfd4dc;
  --accent:#2457d6;--accent-soft:#eaf0fd;--ok:#12805c;--ok-soft:#e3f5ec;--warn:#b45309;--warn-soft:#fdf1e2;--bad:#c2372d;--bad-soft:#fce9e7;
  --g-direct:#0f766e;--g-neighbor:#6d28d9;--g-leader:#c2410c;--g-adjacent:#be185d;
  --r:14px;--r-sm:10px;--shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);--shadow-lg:0 12px 40px rgba(16,24,40,.18);
  --font:'Figtree',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;font-family:var(--font);color:var(--ink);background:var(--bg);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
  display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.ci *{box-sizing:border-box}
.ci b,.ci strong{font-weight:700}
.ci button{font:inherit;color:inherit;cursor:pointer}
.ci a{color:var(--accent);text-decoration:none}.ci a:hover{text-decoration:underline}
.ci :focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.ci [hidden]{display:none!important}
/* sidebar */
.ci .side{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:18px}
.ci .brandmark{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.ci .brandmark .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ci .brandmark .t{font-size:17px;font-weight:800;line-height:1.25}
.ci .nav{display:flex;flex-direction:column;gap:2px}
.ci .nav .sec{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
.ci .nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:15px;font-weight:500;color:var(--ink-2);cursor:pointer}
.ci .nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.ci .nav button:hover{background:var(--panel-2)}
.ci .nav button[aria-current=page]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.ci .nav .num{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);background:var(--panel-2);border-radius:999px;padding:1px 8px}
.ci .side .foot{margin-top:auto;font-size:12.5px;color:var(--muted);padding:0 10px;line-height:1.45}
/* main */
.ci .main{min-width:0;display:flex;flex-direction:column}
.ci .top{position:sticky;top:0;z-index:5;background:rgba(245,246,248,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px max(20px,3vw);display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.ci .top .crumb{font-size:13px;color:var(--muted);font-weight:600}
.ci .top h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.ci .top .tl{min-width:0;flex:1 1 280px}
.ci .picker{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0;max-width:100%}.ci .picker select{width:auto;max-width:min(300px,100%)}
.ci .picker label{font-size:13px;font-weight:600;color:var(--muted)}
.ci select,.ci input[type=search]{font:inherit;font-size:15px;color:var(--ink);background:var(--panel);border:1px solid var(--line-2);border-radius:10px;padding:8px 12px;min-height:40px;max-width:100%}
.ci select{padding-right:32px}
.ci input[type=search]{min-width:min(100%,240px)}
.ci .content{padding:24px max(20px,3vw) 64px;max-width:1180px;width:100%}
.ci .page{display:flex;flex-direction:column;gap:22px}
.ci .phead{display:flex;flex-direction:column;gap:6px;max-width:72ch}
.ci .phead h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-.015em;line-height:1.2}
.ci .phead p{margin:0;color:var(--ink-2);font-size:16.5px}
.ci h3{margin:0;font-size:19px;font-weight:700;line-height:1.3}
.ci h4{margin:0;font-size:16px;font-weight:700}
.ci .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);min-width:0}
.ci .card>.ch{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:14px}
.ci .card>.ch p{margin:4px 0 0;color:var(--muted);font-size:14.5px;flex-basis:100%}
.ci .note{color:var(--muted);font-size:14.5px;margin:0}
.ci .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px}
.ci .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.ci .list{display:flex;flex-direction:column;gap:12px}
.ci .muted{color:var(--muted)}
.ci .small{font-size:14px}
.ci .tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--panel-2);color:var(--ink-2);white-space:nowrap}
.ci .tag .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.ci .tag.ok{background:var(--ok-soft);color:var(--ok)}.ci .tag.warn{background:var(--warn-soft);color:var(--warn)}.ci .tag.bad{background:var(--bad-soft);color:var(--bad)}.ci .tag.blue{background:var(--accent-soft);color:var(--accent)}
.ci .tag.dark{background:var(--ink);color:#fff}
.ci .tags{display:flex;flex-wrap:wrap;gap:6px}
.ci .btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--panel);border-radius:10px;padding:8px 14px;font-size:14.5px;font-weight:600;min-height:38px}
.ci .btn:hover{border-color:var(--ink-2)}
.ci .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.ci .btn.sm{min-height:32px;padding:5px 11px;font-size:13.5px}
.ci .btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ci .seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--panel-2);border-radius:12px;padding:4px}
.ci .seg button{all:unset;cursor:pointer;padding:7px 14px;border-radius:9px;font-size:14.5px;font-weight:600;color:var(--ink-2)}
.ci .seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.ci .toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.ci .toolbar .count{font-size:14px;color:var(--muted);font-weight:600;margin-left:auto}
.ci .quote{font-size:18px;font-weight:700;line-height:1.4;color:#1c3b8c}
.ci .kv{display:grid;grid-template-columns:minmax(110px,170px) 1fr;gap:8px 16px;margin:0}
.ci .kv dt{color:var(--muted);font-size:14px;font-weight:600;padding-top:1px}
.ci .kv dd{margin:0;min-width:0}
.ci .kv ul{margin:0;padding-left:18px}
.ci details.more{border-top:1px solid var(--line);margin-top:14px;padding-top:10px}
.ci details.more>summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--accent);list-style:none;display:inline-flex;align-items:center;gap:6px}
.ci details.more>summary::-webkit-details-marker{display:none}
.ci details.more>summary::before{content:'';width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
.ci details.more[open]>summary::before{transform:rotate(45deg)}
.ci details.more>div{margin-top:12px}
.ci .empty{padding:28px;text-align:center;color:var(--muted);font-size:15px;background:var(--panel);border:1px dashed var(--line-2);border-radius:var(--r)}
.ci .dash-skeleton{min-height:80px}
/* overview */
.ci .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.ci .step{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.ci .step .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
.ci .step b{display:block;font-size:15.5px}
.ci .step span{font-size:14px;color:var(--muted)}
.ci .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.ci .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.ci .stat .v{font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.ci .stat .l{font-size:13.5px;color:var(--muted);font-weight:600;margin-top:4px}
.ci .bigpic{font-size:17.5px;line-height:1.65;color:var(--ink);max-width:75ch;margin:0}
.ci .moves{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.ci .move{border:1px solid var(--line);border-radius:var(--r);padding:18px;background:var(--panel);display:flex;flex-direction:column;gap:8px;position:relative}
.ci .move .n{font-size:13px;font-weight:800;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
.ci .move p{margin:0;color:var(--ink-2);font-size:15px}
.ci .move .ev{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:auto}
.ci .checks,.ci .xs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ci .checks li,.ci .xs li{display:flex;gap:10px;font-size:15.5px;line-height:1.5}
.ci .checks li::before,.ci .xs li::before{flex:none;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;margin-top:1px}
.ci .checks li::before{content:'✓';background:var(--ok-soft);color:var(--ok)}
.ci .xs li::before{content:'✕';background:var(--bad-soft);color:var(--bad)}
/* test cards */
.ci .tcard{display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.ci .ring{--p:0;--c:var(--accent);width:56px;height:56px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--panel-2) 0);display:flex;align-items:center;justify-content:center}
.ci .ring span{width:44px;height:44px;border-radius:50%;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:16px;line-height:1;font-variant-numeric:tabular-nums}
.ci .ring small{font-size:10px;color:var(--muted);font-weight:600;margin-top:2px}
.ci .tcard .tt{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-start;justify-content:space-between}
.ci .tcard h4{font-size:17px;line-height:1.35;flex:1 1 300px}
.ci .tcard .how{margin:8px 0 0;font-size:15.5px;color:var(--ink-2)}
.ci .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}.ci .tcard .acts{margin-top:12px}.ci .tt{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-start}
.ci .sq{font-size:16.5px;font-weight:700;line-height:1.45}.ci .sm{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.ci .scores{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:600}
.ci .scores i{font-style:normal;color:var(--ink)}
/* plan */
.ci .timeline{display:flex;flex-direction:column;gap:0;position:relative}
.ci .phase{display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px;padding:0 0 22px;position:relative}
.ci .phase::before{content:'';position:absolute;left:131px;top:8px;bottom:0;width:2px;background:var(--line)}
.ci .phase:last-child::before{display:none}
.ci .phase .wk{font-weight:800;font-size:15px;color:var(--accent);text-align:right;padding-top:2px}
.ci .phase .body{position:relative;padding-left:24px}
.ci .phase .body::before{content:'';position:absolute;left:-12px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.ci .phase ul{margin:8px 0 0;padding-left:18px;color:var(--ink-2)}
.ci .phase li{margin:3px 0}
/* tables */
.ci .tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.ci .tbl th{text-align:left;font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0}
.ci .tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
.ci .tbl td.n,.ci .tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.ci .scroll{overflow:auto;max-width:100%}
/* site */
.ci .vcard{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--vc,var(--line-2));border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.ci .vcard .row{display:grid;grid-template-columns:minmax(120px,180px) minmax(0,1fr);gap:4px 16px;font-size:15px}
.ci .vcard .row .k{color:var(--muted);font-weight:700;font-size:13.5px;text-transform:uppercase;letter-spacing:.03em;padding-top:2px}
.ci .vcard .do{background:var(--accent-soft);border-radius:var(--r-sm);padding:10px 14px;font-weight:600;color:#1c3b8c}
/* brands */
.ci .gsec{display:flex;flex-direction:column;gap:12px}
.ci .gsec .gh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.ci .gsec .gh h3{display:flex;align-items:center;gap:10px}
.ci .gsec .gh h3::before{content:'';width:12px;height:12px;border-radius:4px;background:var(--gc)}
.ci .bcard{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--gc);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);transition:box-shadow .15s,transform .15s}
.ci .bcard:hover{box-shadow:0 6px 20px rgba(16,24,40,.10);transform:translateY(-1px)}
.ci .bcard .bn{font-size:17px;font-weight:800;line-height:1.25}
.ci .bcard .bc{font-size:13.5px;color:var(--muted);font-weight:600}
.ci .bcard .bl{font-size:14.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ci .bcard .bs{display:flex;gap:14px;font-size:13px;color:var(--muted);font-weight:600;margin-top:auto;border-top:1px solid var(--line);padding-top:10px}
.ci .bcard .bs b{color:var(--ink);font-variant-numeric:tabular-nums}
.ci .bcard .go{font-size:13.5px;font-weight:700;color:var(--accent)}
/* drawer */
.ci .scrim{position:fixed;inset:0;background:rgba(16,24,40,.35);z-index:40}
.ci .drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100vw);background:var(--bg);z-index:41;box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
.ci .drawer .dh{background:var(--panel);border-bottom:1px solid var(--line);padding:18px 22px;display:flex;gap:12px;align-items:flex-start;padding-top:max(18px,env(safe-area-inset-top,0px))}
.ci .drawer .dh .x{margin-left:auto;flex:none}
.ci .drawer .db{overflow:auto;padding:20px 22px 40px;display:flex;flex-direction:column;gap:16px}
.ci .drawer .dname{font-size:22px;font-weight:800;line-height:1.2}
.ci .dsec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.ci .dsec>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;font-size:16px}
.ci .dsec>summary::-webkit-details-marker{display:none}
.ci .dsec>summary::after{content:'';width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s;flex:none}
.ci .dsec[open]>summary::after{transform:rotate(-135deg)}
.ci .dsec>div{margin-top:12px;display:flex;flex-direction:column;gap:12px}
.ci .mini{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;background:var(--panel)}
.ci .mini .mt{font-weight:700;font-size:15px}
.ci .mini p{margin:4px 0 0;font-size:14.5px;color:var(--ink-2)}
/* markets */
.ci .meters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ci .meter .ml{font-size:12.5px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between}
.ci .meter .bar{height:8px;border-radius:999px;background:var(--panel-2);overflow:hidden;margin-top:5px}
.ci .meter .bar i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.ci .rank{display:flex;flex-direction:column;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.ci .rank .rh{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ci .rank .pos{flex:none;width:34px;height:34px;border-radius:10px;background:var(--ink);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.ci .rank .rt{flex:1 1 260px;min-width:0}
.ci .rank .rt b{font-size:17px}
.ci .line{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;background:var(--accent-soft);border-radius:var(--r-sm);padding:12px 14px}
.ci .line .lq{font-weight:700;color:#1c3b8c;font-size:16px;line-height:1.45}
/* swipe */
.ci .swipe{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.ci .swipe .sq{font-size:16.5px;font-weight:700;line-height:1.45}
.ci .swipe .sm{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.ci .sub{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.ci .sub button{all:unset;cursor:pointer;padding:10px 14px;font-weight:700;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.ci .sub button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--accent)}
/* money / strength */
.ci .defs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.ci .def{border-radius:var(--r);padding:14px 16px;background:var(--panel);border:1px solid var(--line)}
.ci .def b{display:flex;align-items:center;gap:8px;font-size:15px}
.ci .def span{font-size:14px;color:var(--ink-2)}
/* research bars */
.ci .bars{display:flex;flex-direction:column;gap:8px}
.ci .brow{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 54px;gap:12px;align-items:center;font-size:14px}
.ci .brow .track{position:relative;height:12px;background:var(--panel-2);border-radius:999px}
.ci .brow .track i{position:absolute;top:0;bottom:0;left:0;border-radius:999px;background:var(--line-2)}
.ci .brow .track i.up{background:var(--ok)}.ci .brow .track i.down{background:var(--bad)}
.ci .brow .track .one{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.5}
.ci .brow .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.ci .script{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
.ci .transcript{white-space:pre-wrap;font-size:15px;line-height:1.65;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.ci .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:60;box-shadow:var(--shadow-lg)}
.ci .help{background:linear-gradient(180deg,#f3f7ff,#fff);border:1px solid #dbe5fb;border-radius:var(--r);padding:16px 18px;display:flex;gap:12px;align-items:flex-start}
.ci .help .i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.ci .help p{margin:0;font-size:14.5px;color:var(--ink-2)}
@media (max-width:920px){
  .ci{grid-template-columns:minmax(0,1fr)}

<template id="tpl-overview">
  <section class="page" id="overview">
    <div class="phead"><h2>Start here</h2><p>The whole study on one page: what competitor ads show, what that might mean for <span class="stu"></span>, and ideas worth testing. These are readings from the ads, not instructions. Your own tests decide.</p></div>
    <div class="steps">
      <div class="step"><div class="n">1</div><div><b>See what the ads show</b><span>The facts first, with how sure we are.</span></div></div>
      <div class="step"><div class="n">2</div><div><b>Weigh the opportunities</b><span>Each one has a case for and a case against.</span></div></div>
      <div class="step"><div class="n">3</div><div><b>Test, then decide</b><span>Pick tests you believe in. Results beat this page.</span></div></div>
    </div>
    <div class="stats" id="ov-stats" data-source="headline"></div>
    <div class="card" id="ov-bigpic-card"><div class="ch"><h3>What the market looks like</h3></div><p class="bigpic dash-skeleton" id="ov-bigpic" data-source="thesis"></p></div>
    <div class="card" id="ov-facts-card"><div class="ch"><h3>What the ads show</h3><p>How often a theme appears in the first lines of the ads we read, and how those ads do against the average. A winner is in the brand's top 20% by impressions.</p></div><div class="toolbar" id="ov-facts-scope"></div><div id="ov-facts" data-source="claim_check"></div><p class="note" id="ov-facts-note">Sorted by how many ads use the theme. 1.00× is the average; the line marks it. Keyword match on the ads we sampled, which lean toward each brand's top ads: a signal to test, not proof. Small samples are greyed out; themes in fewer than 5 ads are hidden.</p></div>
    <div class="card" id="ov-moves-card"><div class="ch"><h3>Opportunities the data points to</h3><p>In no particular order. Each one shows the case for, the case against, and how sure the data is. They are things to test, not things to do.</p></div><div class="moves" id="ov-moves" data-source="thesis"></div></div>
    <div class="grid2">
      <div class="card" id="ov-ws-card"><div class="ch"><h3>Possible openings for <span class="stu"></span></h3><p>What competitors seem to leave open in the ads we read. An opening in the ads is not proof that buyers want it.</p></div><ul class="checks" id="ov-ws" data-source="thesis"></ul></div>
      <div class="card" id="ov-dont-card"><div class="ch"><h3>Claims to avoid</h3><p>Claims that risk ad rejection or legal trouble. This is the one firm list on the page.</p></div><ul class="xs" id="ov-dont" data-source="thesis"></ul></div>
    </div>
    <div class="card" id="ov-tests-card"><div class="ch"><h3>Test ideas with the most support</h3><p>A high score means more evidence behind the idea, not a sure winner. Each has a ready-to-copy brief.</p></div><div class="list" id="ov-tests" data-source="hypotheses"></div><div style="margin-top:14px"><button class="btn" data-go="tests">See all test ideas →</button></div></div>

    </div>

<template id="tpl-guide">
  <section class="page" id="guide">
    <div class="phead"><h2>How to read this</h2><p>The words this study uses, in plain English.</p></div>
    <div class="grid2">
      <div class="card"><h3>Winner</h3><p>An ad Meta shows a lot: the top 20% of a brand's ads by impressions. Not just an ad that stays live: some run for months with almost no spend.</p></div>
      <div class="card"><h3>Proven / Scaling now</h3><p><b>Proven</b>: a winner live for 30+ days. <b>Scaling now</b>: a winner under 30 days old, so it is what the brand bets on right now.</p></div>
      <div class="card"><h3>Opening line (hook)</h3><p>The first sentence of an ad. It decides if people stop scrolling. Brands that re-shoot the same opening many times are paying to scale it.</p></div>
      <div class="card"><h3>Format</h3><p>How the ad is shown: a creator talking to camera, a voiceover over clips, text on screen, a skit, a long story.</p></div>
